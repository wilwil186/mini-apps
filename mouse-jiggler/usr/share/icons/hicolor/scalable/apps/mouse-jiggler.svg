<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
  </defs>
  <!-- Mouse body -->
  <rect x="20" y="12" width="24" height="36" rx="12" ry="12" fill="url(#body)"/>
  <!-- Scroll wheel -->
  <rect x="30" y="20" width="4" height="10" rx="2" ry="2" fill="#888"/>
  <!-- Left button line -->
  <line x1="22" y1="16" x2="30" y2="24" stroke="#aaa" stroke-width="1" stroke-dasharray="2,1"/>
  <!-- Right button line -->
  <line x1="42" y1="16" x2="34" y2="24" stroke="#aaa" stroke-width="1" stroke-dasharray="2,1"/>
  <!-- Motion arc -->
  <path d="M 44 30 Q 58 28 56 16" fill="none" stroke="#2ecc71" stroke-width="2" stroke-linecap="round"/>
  <polygon points="56,16 52,22 58,20" fill="#2ecc71"/>
  <!-- Status dot -->
  <circle cx="52" cy="48" r="6" fill="url(#dot)"/>
  <circle cx="52" cy="48" r="4" fill="#2ecc71" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
